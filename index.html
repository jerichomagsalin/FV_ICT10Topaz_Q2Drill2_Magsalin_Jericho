<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
    <script type="py" src="main.py"></script>
</head>
<style>
    * {
        font-family:system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif
    }

    body {
        background-color: #FCE8A4
    }

    h3 {
        text-align:center;
    }

    input[type="text"] {
        font-size: 18px;
        width: 100%
    }

    label {
        font-size:18px;
    }

    #form-structure {
        margin: auto;
        width: 400px;
        background-color: #337ccf;
        padding: 25px;
        border: 2px solid black;
        border-radius: 4px;
    }

    #list-structure {
        background-color: #CCCCCC;
        padding: 12px 25px 25px 25px;
    }

    #button {
        width: 100%;
        padding: 18px;
        font-size: 18px;
    }

    #button:hover {
        width: 100%;
        padding: 18px;
        font-size: 18px;
        background-color:#81CC69;
        border-radius: 3px;
    }

</style>
<body>

    <br><br><br>

    <div id="form-structure">

        <h3>Add a new club member</h3>

        <form action="">
            <label for="firstname">Firstname:</label>
            <br>
            <input type="text" id="firstname" placeholder="Jericho">
            <br>
            <label for="lastname">Lastname:</label>
            <br>
            <input type="text" id="lastname" placeholder="Magsalin">

            <br><br><br>

            <button id="button" type="button" py-click="add_member">Confirm Addition</button>
        </form>

        <br>
        <hr>
        <br>

        <div id="list-structure">
            <p>Official Club Members:</p>
                <p>Jericho Magsalin</p>
                <p>Jericho Magsalin</p>
                <p>Jericho Magsalin</p>
                <p>Jericho Magsalin</p>
                <div id="newmember"></p>
        </div>
    </div>

</body>
</html>
